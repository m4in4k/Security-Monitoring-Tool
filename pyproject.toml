[project]
name = "sekuro"
version = "0.1.0"
description = "The API for the Sekuro availability and security monitoring platform."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4.0",
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
sekuro-api = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "migrations*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require the isolated PostgreSQL test service",
]

