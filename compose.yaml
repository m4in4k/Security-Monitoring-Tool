services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sekuro
      POSTGRES_USER: sekuro
      POSTGRES_PASSWORD: sekuro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekuro -d sekuro"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sekuro-postgres-data:/var/lib/postgresql/data

volumes:
  sekuro-postgres-data:
