services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sekuro
      POSTGRES_USER: sekuro
      POSTGRES_PASSWORD: sekuro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekuro -d sekuro"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sekuro-postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: sekuro_test
      POSTGRES_USER: sekuro_test
      POSTGRES_PASSWORD: sekuro_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sekuro_test -d sekuro_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  sekuro-postgres-data:
